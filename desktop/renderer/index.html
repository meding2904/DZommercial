<!doctype html>
<html lang="en" data-preset="cellar" data-scheme="dark">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: azahar-asset:; font-src azahar-asset:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Azahar admin</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<div class="boot" id="boot">
			<p class="wordmark">Azahar<span>.</span></p>
			<p class="meta">Reading the ledger…</p>
		</div>

		<section class="login-screen" id="login-screen" hidden>
			<div class="login-card">
				<header>
					<h1 class="wordmark"><span data-brand>Azahar</span><span>.</span></h1>
					<p class="login-sub">Admin ledger</p>
				</header>
				<p class="meta" id="login-intro">Sign in to run the counter, the orders and the stock.</p>
				<form id="login-form" novalidate>
					<div class="field">
						<label for="login-email">Email</label>
						<input class="input" id="login-email" name="email" type="email" autocomplete="username" required />
					</div>
					<div class="field">
						<label for="login-password">Password</label>
						<input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required />
					</div>
					<div class="form-error" id="login-error" role="alert" hidden></div>
					<button class="button button-primary button-block" type="submit" id="login-submit">Sign in</button>
				</form>
				<div class="login-status" id="login-status" role="status">
					<span class="status-dot" aria-hidden="true"></span>
					<span id="login-status-text">Reading the API…</span>
				</div>
				<details class="connection-details">
					<summary>Connection</summary>
					<form id="connection-form" class="connection-form" novalidate>
						<div class="field">
							<label for="connection-api">API address</label>
							<input class="input" id="connection-api" autocomplete="url" />
						</div>
						<div class="field">
							<label for="connection-origin">Request origin, optional</label>
							<input class="input" id="connection-origin" autocomplete="url" placeholder="Auto, read from the API" />
						</div>
						<div class="form-error" id="connection-error" role="alert" hidden></div>
						<button class="button button-secondary" type="submit">Save and reconnect</button>
					</form>
				</details>
			</div>
		</section>

		<div class="admin-shell" id="admin-shell" hidden>
			<aside class="rail">
				<div class="rail-head">
					<p class="wordmark"><span data-brand>Azahar</span><span>.</span></p>
					<p class="rail-sub">Admin ledger</p>
				</div>
				<nav class="rail-nav" aria-label="Admin">
					<a href="#/ledger" data-route="ledger">Ledger</a>
					<a href="#/counter" data-route="counter">Counter sale</a>
					<a href="#/orders" data-route="orders">Orders</a>
					<a href="#/products" data-route="products">Products and stock</a>
					<a href="#/customers" data-route="customers">Customers</a>
					<a href="#/staff" data-route="staff">Staff</a>
				</nav>
				<div class="rail-foot">
					<div class="rail-theme">
						<label for="preset-select">Style</label>
						<select class="select" id="preset-select">
							<option value="plaster">Plaster</option>
							<option value="cellar">Cellar</option>
							<option value="terracotta">Terracotta</option>
							<option value="lagoon">Lagoon</option>
						</select>
					</div>
					<button class="rail-scheme" id="scheme-toggle" type="button">
						<svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
						</svg>
						<svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<circle cx="12" cy="12" r="4" />
							<path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
						</svg>
						<span id="scheme-label">Dark</span>
					</button>
					<div class="rail-user">
						<span id="rail-user-name">Signed in</span>
						<span class="meta" id="rail-user-role"></span>
					</div>
					<button class="link-button" id="sign-out" type="button">Sign out</button>
				</div>
			</aside>
			<main id="main" tabindex="-1">
				<div class="view" id="view" aria-live="polite"></div>
			</main>
		</div>

		<dialog id="order-dialog" class="dialog" aria-labelledby="order-dialog-title"></dialog>

		<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

		<noscript><p class="no-js">The Azahar admin needs JavaScript.</p></noscript>
		<script src="./app.js"></script>
	</body>
</html>
